name: 지금 새로 조사 (관리자)
# 틈틈이 앱 관리자 화면의 '지금 새로 조사' 버튼이 이 워크플로를 시작해요(workflow_dispatch).
# 저장소에 쓰기 권한이 있는 사람(관리자)의 GitHub 열쇠로만 시작할 수 있어요.
# 하는 일: 마지막 조사 뒤 쉬는 시간이 지났으면 Claude 루틴 '틈틈이 빠른 업데이트'를 API로 시작해요.
# 루틴 열쇠는 저장소 비밀값 ROUTINE_TOKEN에만 있어요(파일에 적지 않아요).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owner-refresh
  cancel-in-progress: false

jobs:
  fire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ROUTINE_ID: trig_01YFimLgf4MxXCH9aS9ec4Dw
    steps:
      - uses: actions/checkout@v4

      - name: 쉬는 시간 확인
        id: gap
        run: |
          python3 pipeline/version.py --age | tee age.json
          if python3 -c "import json,sys; sys.exit(0 if json.load(open('age.json'))['tooSoon'] else 1)"; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::notice::마지막 조사를 마친 지 얼마 안 돼서 이번에는 건너뛰어요."
          fi

      - name: Claude 루틴 시작
        if: steps.gap.outputs.skip != '1'
        env:
          ROUTINE_TOKEN: ${{ secrets.ROUTINE_TOKEN }}
        run: |
          if [ -z "$ROUTINE_TOKEN" ]; then
            echo "::error::저장소 비밀값 ROUTINE_TOKEN이 없어요. Settings → Secrets and variables → Actions에서 넣어 주세요."
            exit 1
          fi
          code=$(curl -sS -o res.json -w '%{http_code}' -X POST \
            "https://api.anthropic.com/v1/claude_code/routines/${ROUTINE_ID}/fire" \
            -H "Authorization: Bearer ${ROUTINE_TOKEN}" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d '{"text":"관리자가 틈틈이 앱에서 지금 새로 조사를 눌렀어요."}')
          echo "HTTP ${code}"
          if [ "${code}" != "200" ]; then
            python3 -c "import json; e=json.load(open('res.json')).get('error',{}); print('오류:', e.get('type'), e.get('message'))" || cat res.json
            exit 1
          fi
          python3 -c "import json; print('시작한 세션:', json.load(open('res.json')).get('claude_code_session_url'))"
